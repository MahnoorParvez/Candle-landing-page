<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wick &amp; Wild</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- header with brand name -->
  <header class="header">
    <h1>Wick &amp; Wild</h1>
  </header>

  <!-- hero section -->
  <section class="hero">
    <h2>Forest Night Candle</h2>
    <p>A handmade candle that smells like pine and wood. It burns for 50 hours.</p>
    <a href="#features" class="btn">Buy Now</a>
  </section>

  <!-- features section -->
  <section class="features" id="features">
    <h2>Features</h2>
    <div class="cards">
      <div class="card">
        <h3>Soy Wax</h3>
        <p>Made with soy wax. It burns clean.</p>
      </div>
      <div class="card">
        <h3>Handmade</h3>
        <p>Each candle is made by hand.</p>
      </div>
      <div class="card">
        <h3>Long Burning</h3>
        <p>One candle lasts for 50 hours.</p>
      </div>
    </div>
  </section>
</body>
</html>
